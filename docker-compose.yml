services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: docuflow-web:1.0.0
    container_name: web
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: docuflow-api:1.0.0
    container_name: api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PGHOST: "db"
      PGPORT: "5432"
      PGDATABASE: "docuflow"
      PGUSER: "postgres"
      PGPASSWORD: "examplepassword"
      # Для навчального стенду; у реальному розгортанні — секрет (див. k8s/secret.yaml)
      JWT_SECRET: "compose-dev-secret-change-me"
      LOG_FILE: "/tmp/logs/docuflow-api.log"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_DB: docuflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: examplepassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docuflow"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
