<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuFlow</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
            <a href="#/" class="company" id="companyName">DocuFlow</a>
            <button class="icon-btn mobile-only" id="closeSidebar" aria-label="Закрити меню">✕</button>
        </div>

        <form id="searchForm" class="search" role="search">
            <input id="searchInput" type="search" placeholder="🔍 Пошук по базі знань" minlength="2" maxlength="100">
        </form>

        <nav class="nav">
            <a href="#/" data-route="home">🏠 Головна</a>
            <a href="#/org" data-route="org">🏢 Оргструктура</a>
            <a href="#/members" data-route="members">👥 Працівники</a>
            <a href="#/trash" data-route="trash" id="trashLink">🗑️ Кошик</a>
        </nav>

        <div class="tree-head">
            <span>Розділи</span>
            <button class="icon-btn" id="addRootPage" title="Новий розділ">＋</button>
        </div>
        <ul class="tree" id="pageTree"></ul>

        <div class="sidebar-foot">
            <div class="me">
                <strong id="meName"></strong>
                <span id="meRole" class="role-badge"></span>
            </div>
            <button class="btn btn-ghost btn-small" id="logoutBtn">Вийти</button>
        </div>
    </aside>

    <div class="main">
        <header class="topbar mobile-only">
            <button class="icon-btn" id="openSidebar" aria-label="Меню">☰</button>
            <span>DocuFlow</span>
        </header>
        <main id="view" class="view"></main>
    </div>

    <div id="toasts"></div>

    <script src="config.js"></script>
    <script src="http.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/tree.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/views.js"></script>
    <script src="js/org.js"></script>
    <script src="js/members.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
